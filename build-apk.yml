name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Phone Installation
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/PhiMatiCs-Classes-App.apk

      - name: Upload APK Artifact (Available under Actions -> Summary)
        uses: actions/upload-artifact@v4
        with:
          name: PhiMatiCs-Classes-APK
          path: output/PhiMatiCs-Classes-App.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct 1-Tap APK Download)
        uses: softprops/action-gh-release@v2
        with:
          files: output/PhiMatiCs-Classes-App.apk
          tag_name: v1.0.0
          name: "PhiMatiCs Classes Android App (v1.0.0)"
          body: |
            📲 **Official PhiMatiCs Classes Android App**
            
            Tap **`PhiMatiCs-Classes-App.apk`** below to download and install directly on your Android phone!
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
